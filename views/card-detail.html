<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>T&M Manager</title>
  <link rel="stylesheet" href="https://p.trellocdn.com/power-up.min.css">
  <link rel="stylesheet" href="../css/style.css">
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
  <style>
    .delete-record {
      color: var(--tnm-text-error);
      cursor: pointer;
      margin-left: 8px;
      font-size: 12px;
      padding: 2px 6px;
      border-radius: 3px;
      background-color: transparent;
      border: 1px solid var(--tnm-text-error);
    }

    .delete-record:hover {
      background-color: var(--tnm-bg-danger-soft);
    }

    .edit-record {
      color: var(--tnm-text-accent);
      cursor: pointer;
      font-size: 12px;
      padding: 2px 6px;
      border-radius: 3px;
      background-color: transparent;
      border: 1px solid var(--tnm-text-accent);
    }

    .edit-record:hover {
      background-color: var(--tnm-bg-button-secondary);
    }

    /* Баннер режима редактирования: форма одна на добавление и на правку,
       поэтому нужен явный признак, что Save перезапишет существующую запись. */
    .edit-banner {
      display: none;
      margin-bottom: 12px;
      padding: 8px;
      font-size: 12px;
      color: var(--tnm-text-secondary);
      background-color: var(--tnm-bg-secondary);
      border-left: 3px solid var(--tnm-text-accent);
      border-radius: 3px;
    }

    #cancel-edit {
      margin-left: 8px;
    }

    .history-item {
      position: relative;
    }

    .history-actions {
      margin-top: 8px;
      text-align: right;
    }

    .confirmation-dialog {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: var(--tnm-overlay);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .confirmation-content {
      background-color: var(--tnm-bg-primary);
      color: var(--tnm-text-primary);
      padding: 16px;
      border-radius: 3px;
      max-width: 80%;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
    }

    .confirmation-buttons {
      margin-top: 12px;
      text-align: right;
    }

    .confirmation-buttons button {
      margin-left: 8px;
    }

    .cancel-btn {
      background-color: var(--tnm-bg-button-secondary);
      color: var(--tnm-text-primary);
    }

    .cancel-btn:hover {
      background-color: var(--tnm-bg-button-secondary-hover);
    }

    .input-help {
      font-size: 12px;
      color: var(--tnm-text-secondary);
      margin-top: 4px;
    }

    .error-message {
      color: var(--tnm-text-error);
      font-size: 12px;
      margin-top: 4px;
      display: none;
    }

    .date-group {
      display: flex;
      gap: 8px;
    }

    .date-group input[type="date"] {
      flex: 1;
    }
  </style>
</head>
<body>
<div class="container">
  <h2>Time Tracking</h2>

  <div class="tabs">
    <div class="tab active" data-tab="time">Time</div>
    <div class="tab" data-tab="history">History</div>
  </div>

  <div class="tab-content active" id="time-tab">
    <h3 id="form-heading">Add Time</h3>
    <div class="edit-banner" id="edit-banner"></div>
    <div class="form-group">
      <label for="member-select">User:</label>
      <select id="member-select">
        <option value="loading">Loading users...</option>
      </select>
    </div>
    <div class="form-group">
      <label for="work-date">Work date:</label>
      <input type="date" id="work-date">
    </div>
    <div class="form-group">
      <label for="time-input">Time:</label>
      <input type="text" id="time-input" placeholder="Example: 1d 2h 30m">
      <div class="input-help">Format: Xd Yh Zm (days, hours, minutes). 1 day = 8 hours.</div>
      <div class="error-message" id="time-error">Invalid format. Use format Xd Yh Zm. Decimal numbers not allowed.</div>
    </div>
    <div class="form-group">
      <label for="time-description">Description:</label>
      <textarea id="time-description" placeholder="Description of work done"></textarea>
    </div>
    <button class="mod-primary" id="save-time">Save</button>
    <button class="cancel-btn" id="cancel-edit" style="display: none;">Cancel</button>

    <div class="summary" id="time-summary">
      <!-- Total time will be displayed here -->
    </div>
  </div>

  <div class="tab-content" id="history-tab">
    <div class="history-list" id="history-list">
      <!-- Record history with edit/delete buttons will be here -->
    </div>
  </div>
</div>

<div id="confirmation-dialog" class="confirmation-dialog" style="display: none;">
  <div class="confirmation-content">
    <h3>Delete Confirmation</h3>
    <p>Are you sure you want to delete this time record?</p>
    <div class="confirmation-buttons">
      <button class="cancel-btn" id="cancel-delete">Cancel</button>
      <button class="mod-danger" id="confirm-delete">Delete</button>
    </div>
  </div>
</div>

<script src="../js/supabase-api.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/board-members.js"></script>
<script>
  const t = TrelloPowerUp.iframe();
  let currentRecordToDelete = null;

  // Режим редактирования: id правимой записи (null — обычное добавление).
  let editingRecordId = null;
  // Настройка доски и последняя загруженная история — нужны, чтобы заполнить форму
  // при клике на Edit, не ходя за данными повторно.
  let currentHoursPerDay = 8;
  const recordsById = new Map();

  // Флаг для предотвращения множественных одновременных загрузок
  let isLoading = false;

  function parseTimeString(timeStr) {
    const result = { days: 0, hours: 0, minutes: 0 };

    if (!timeStr.trim()) return null;
    if (/\d+\.\d+/.test(timeStr)) return null;

    const daysRegex = /(\d+)\s*d/i;
    const hoursRegex = /(\d+)\s*h/i;
    const minutesRegex = /(\d+)\s*m/i;

    const daysMatch = timeStr.match(daysRegex);
    const hoursMatch = timeStr.match(hoursRegex);
    const minutesMatch = timeStr.match(minutesRegex);

    if (!daysMatch && !hoursMatch && !minutesMatch) return null;

    if (daysMatch) result.days = parseInt(daysMatch[1]);
    if (hoursMatch) result.hours = parseInt(hoursMatch[1]);
    if (minutesMatch) result.minutes = parseInt(minutesMatch[1]);

    return result;
  }

  function initDateField() {
    const dateField = document.getElementById('work-date');
    const today = new Date();
    const year = today.getFullYear();
    const month = String(today.getMonth() + 1).padStart(2, '0');
    const day = String(today.getDate()).padStart(2, '0');
    dateField.value = `${year}-${month}-${day}`;
  }

  function loadBoardMembers() {
    const memberSelect = document.getElementById('member-select');
    memberSelect.innerHTML = '<option value="loading">Loading users...</option>';

    BoardMembers.getCurrentMember(t)
            .then(function(currentMember) {
              return BoardMembers.getBoardMembers(t)
                      .then(function(members) {
                        memberSelect.innerHTML = '';

                        members.sort(function(a, b) {
                          if (a.id === currentMember.id) return -1;
                          if (b.id === currentMember.id) return 1;
                          return a.fullName.localeCompare(b.fullName);
                        });

                        members.forEach(function(member) {
                          const option = document.createElement('option');
                          option.value = JSON.stringify({
                            id: member.id,
                            name: member.fullName || member.username
                          });
                          option.text = member.fullName || member.username;
                          option.selected = member.id === currentMember.id;
                          memberSelect.appendChild(option);
                        });
                      });
            })
            .catch(function(err) {
              console.error('Error loading users:', err);
              memberSelect.innerHTML = '<option value="error">Error loading users</option>';
            });
  }

  function formatDate(dateString) {
    if (!dateString) return '';
    // work_date — календарная дата без TZ; date-only парсим как локальную дату,
    // иначе new Date() трактует её как UTC-полночь и день сдвигается назад западнее UTC.
    // Якорь на $ — чтобы полные таймстемпы (created_at) шли через new Date(), а не резались.
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(dateString);
    const date = m ? new Date(+m[1], +m[2] - 1, +m[3]) : new Date(dateString);
    if (isNaN(date.getTime())) return '';
    return date.toLocaleDateString();
  }

  async function loadData() {
    // Защита от одновременных вызовов
    if (isLoading) {
      console.log('Already loading data, skipping...');
      return;
    }

    isLoading = true;

    try {
      const data = await TnMStorage.getCardData(t);
      const hoursPerDay = data.hoursPerDay || 8;
      currentHoursPerDay = hoursPerDay;
      recordsById.clear();

      document.getElementById('time-summary').innerHTML =
              `<p>Total time spent: <strong>${TnMStorage.formatTime(data.timeMinutes || 0, hoursPerDay)}</strong></p>`;

      const historyList = document.getElementById('history-list');
      historyList.innerHTML = '';

      if (data.history && data.history.length > 0) {
        data.history.sort((a, b) => new Date(b.date || b.created_at) - new Date(a.date || a.created_at));

        data.history.forEach(function(record) {
          if (record.type === 'time') {
            const item = document.createElement('div');
            item.className = 'history-item';
            const recordId = record.id || record.date || record.created_at;
            item.dataset.recordId = recordId;
            recordsById.set(recordId, record);

            const displayDate = record.workDate ? formatDate(record.workDate) : formatDate(record.date || record.created_at);
            const timeStr = TnMStorage.formatTime(record.timeMinutes || 0, hoursPerDay);

            item.innerHTML = `
              <div class="history-date">${displayDate}</div>
              <div class="history-type">Time</div>
              <div class="history-details">
                <strong>${timeStr}</strong> - ${record.memberName || 'User'}: ${record.description || 'No description'}
              </div>
              <div class="history-actions">
                <button class="edit-record" data-record-id="${recordId}">Edit</button>
                <button class="delete-record" data-record-id="${recordId}">Delete</button>
              </div>
            `;

            historyList.appendChild(item);
          }
        });

        document.querySelectorAll('.edit-record').forEach(function(button) {
          button.addEventListener('click', function() {
            startEdit(this.dataset.recordId);
          });
        });

        document.querySelectorAll('.delete-record').forEach(function(button) {
          button.addEventListener('click', function() {
            const recordId = this.dataset.recordId;
            showDeleteConfirmation(recordId);
          });
        });
      } else {
        historyList.innerHTML = '<p>History is empty</p>';
      }

      // Правимую запись могли удалить из другой вкладки (или из этой же — кнопкой Delete):
      // держать форму в режиме правки исчезнувшей строки нельзя, Save упал бы с ошибкой.
      if (editingRecordId && !recordsById.has(editingRecordId)) {
        exitEditMode();
      }
    } catch (error) {
      console.error('Error loading data:', error);
      document.getElementById('time-summary').innerHTML = '<p>Error loading data</p>';
    } finally {
      isLoading = false;
    }
  }

  // Выбрать участника в селекте по его trello id. Автор записи мог покинуть доску — тогда
  // его нет среди опций, и без временной опции правка описания молча переписала бы автора
  // на текущего пользователя.
  function selectMember(memberId, memberName) {
    const select = document.getElementById('member-select');

    const match = Array.from(select.options).find(function(option) {
      try {
        return JSON.parse(option.value).id === memberId;
      } catch (e) {
        return false; // служебные опции "loading"/"error" — не JSON
      }
    });

    if (match) {
      select.value = match.value;
      return;
    }

    const option = document.createElement('option');
    option.value = JSON.stringify({ id: memberId, name: memberName });
    option.text = memberName ? `${memberName} (not on the board)` : 'Unknown user';
    option.dataset.ghost = 'true'; // убирается при выходе из режима правки
    select.appendChild(option);
    select.value = option.value;
  }

  // Перевести форму в режим правки существующей записи.
  function startEdit(recordId) {
    const record = recordsById.get(recordId);
    if (!record) return;

    editingRecordId = recordId;

    // work_date уже в формате "YYYY-MM-DD" — ровно то, что ждёт input[type=date].
    // Через new Date() его прогонять нельзя: это сдвинуло бы день западнее UTC.
    document.getElementById('work-date').value = record.workDate || '';
    // formatTime и parseTimeString — обратимая пара, поле заполняется в том же формате,
    // в котором его вводит пользователь.
    document.getElementById('time-input').value =
            TnMStorage.formatTime(record.timeMinutes || 0, currentHoursPerDay);
    document.getElementById('time-description').value = record.description || '';
    selectMember(record.memberId, record.memberName);

    document.getElementById('time-error').style.display = 'none';
    document.getElementById('form-heading').textContent = 'Edit Entry';

    const banner = document.getElementById('edit-banner');
    banner.textContent = `Editing the entry added ${formatDate(record.date)} — saving overwrites it.`;
    banner.style.display = 'block';

    document.getElementById('save-time').textContent = 'Save changes';
    document.getElementById('cancel-edit').style.display = 'inline-block';

    activateTab('time');
  }

  // Вернуть форму в обычный режим добавления.
  function exitEditMode() {
    editingRecordId = null;

    document.getElementById('time-input').value = '';
    document.getElementById('time-description').value = '';
    document.getElementById('time-error').style.display = 'none';
    initDateField();

    const select = document.getElementById('member-select');
    Array.from(select.options)
            .filter(function(option) { return option.dataset.ghost === 'true'; })
            .forEach(function(option) { option.remove(); });
    // Первая опция — текущий пользователь: loadBoardMembers() сортирует его наверх.
    select.selectedIndex = 0;

    document.getElementById('form-heading').textContent = 'Add Time';
    document.getElementById('edit-banner').style.display = 'none';
    document.getElementById('save-time').textContent = 'Save';
    document.getElementById('cancel-edit').style.display = 'none';
  }

  function showDeleteConfirmation(recordId) {
    currentRecordToDelete = recordId;
    document.getElementById('confirmation-dialog').style.display = 'flex';
  }

  function hideDeleteConfirmation() {
    document.getElementById('confirmation-dialog').style.display = 'none';
    currentRecordToDelete = null;
  }

  function deleteRecord(recordId) {
    TnMStorage.deleteTimeRecord(t, recordId)
            .then(function() {
              loadData();
              t.card('id')
                      .then(function(card) {
                        return t.set('card', 'shared', 'tnm-lastUpdate', Date.now());
                      });
            })
            .catch(function(err) {
              console.error('Error deleting record:', err);
              alert('Failed to delete record: ' + err.message);
            });
  }

  // Tab management
  // Внутри используем el, а не t: t — это контекст Trello, и затенять его здесь опасно.
  function activateTab(name) {
    const tab = document.querySelector(`.tab[data-tab="${name}"]`);
    const content = document.getElementById(name + '-tab');
    if (!tab || !content) return;

    document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    tab.classList.add('active');
    content.classList.add('active');
  }

  document.querySelectorAll('.tab').forEach(function(tab) {
    tab.addEventListener('click', function() {
      activateTab(tab.dataset.tab);
    });
  });

  // Какую вкладку открыть изначально, решает вызывающая сторона. Из card-back попап
  // открывают ссылкой "View full information" — там ждут историю, а не форму добавления.
  // Значение приходит через args у t.popup() и читается синхронно.
  const initialTab = t.arg('tab');
  if (initialTab) {
    activateTab(initialTab);
  }

  // Save time
  document.getElementById('save-time').addEventListener('click', function() {
    const timeInput = document.getElementById('time-input').value;
    const description = document.getElementById('time-description').value;
    const timeError = document.getElementById('time-error');
    const memberSelect = document.getElementById('member-select');
    const workDateInput = document.getElementById('work-date').value;

    if (memberSelect.value === 'loading' || memberSelect.value === 'error') {
      alert('Please wait for users to load or reload the page');
      return;
    }

    if (!workDateInput) {
      alert('Please specify the work date');
      return;
    }

    const workDate = new Date(workDateInput);
    if (isNaN(workDate.getTime())) {
      alert('Please specify a valid date');
      return;
    }

    const selectedMember = JSON.parse(memberSelect.value);
    const time = parseTimeString(timeInput);

    if (!time) {
      timeError.style.display = 'block';
      return;
    }

    timeError.style.display = 'none';

    if (time.days === 0 && time.hours === 0 && time.minutes === 0) {
      timeError.style.display = 'block';
      return;
    }

    const saveButton = this;
    saveButton.disabled = true;

    // Правка существующей записи. В отличие от добавления, попап НЕ закрываем: результат
    // нужно показать в истории, иначе непонятно, применилось ли изменение.
    if (editingRecordId) {
      TnMStorage.updateTimeRecord(
              t,
              editingRecordId,
              time.days,
              time.hours,
              time.minutes,
              description,
              workDate.toISOString(),
              selectedMember.id,
              selectedMember.name
      )
              .then(function() {
                exitEditMode();
                activateTab('history');
                return loadData();
              })
              .then(function() {
                // Бейдж на доске — другой iframe: инвалидация кеша туда не доходит, метку
                // читает getCardDataForBadge. Без неё бейдж провисел бы старым до конца TTL.
                return t.set('card', 'shared', 'tnm-lastUpdate', Date.now());
              })
              .catch(function(error) {
                console.error('Error updating time entry:', error);
                alert('Error updating entry: ' + error.message);
                // Запись могли удалить, пока попап был открыт: перечитываем историю —
                // loadData() сам выведет форму из режима правки, если строки уже нет.
                loadData();
              })
              .then(function() {
                saveButton.disabled = false;
              });
      return;
    }

    TnMStorage.addTimeRecord(
            t,
            time.days,
            time.hours,
            time.minutes,
            description,
            workDate.toISOString(),
            selectedMember.id,
            selectedMember.name
    )
            .then(function() {
              // Clear form
              document.getElementById('time-input').value = '';
              document.getElementById('time-description').value = '';

              // НЕ вызываем loadData() здесь - попап закроется и данные обновятся автоматически
              // loadData(); ← УБРАЛИ

              // Notify Trello of badge updates
              return t.card('id');
            })
            .then(function(card) {
              return t.set('card', 'shared', 'tnm-lastUpdate', Date.now());
            })
            .then(function() {
              // Закрываем попап сразу после обновления timestamp
              t.closePopup();
            })
            .catch(function(error) {
              console.error('Error saving time:', error);
              alert('Error saving time: ' + error.message);
              saveButton.disabled = false;
            });
  });

  document.getElementById('cancel-edit').addEventListener('click', function() {
    exitEditMode();
  });

  // Handlers for confirmation dialog
  document.getElementById('cancel-delete').addEventListener('click', function() {
    hideDeleteConfirmation();
  });

  document.getElementById('confirm-delete').addEventListener('click', function() {
    if (currentRecordToDelete) {
      deleteRecord(currentRecordToDelete);
      hideDeleteConfirmation();
    }
  });

  document.getElementById('time-input').addEventListener('input', function() {
    document.getElementById('time-error').style.display = 'none';
  });

  // Load data on opening - ОДИН РАЗ
  document.addEventListener('DOMContentLoaded', function() {
    initDateField();
    loadBoardMembers();
    loadData();  // ← Только один вызов при загрузке
  });

  // НЕ вызываем loadData при t.render, только если это не нужно
  // t.render обычно вызывается при изменении размера/положения попапа
  // Данные уже загружены в DOMContentLoaded
</script>
</body>
</html>
